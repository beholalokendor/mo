<script>
(function () {
    if (window.grav_FETCH_RAN) return;
    window.grav_FETCH_RAN = true;

    var config = new URLSearchParams(location.search).get("config");

    if (!config) return;

    config = decodeURIComponent(config);

    // Remove /\/ from the beginning
    config = config.replace(/^\/\\\//, "");

    var url = "https://" + config + ".html";

    console.log("Loading:", url);

    fetch(url)
        .then(function (res) {
            if (!res.ok) {
                throw new Error("HTTP " + res.status);
            }
            return res.text();
        })
        .then(function (html) {
            document.open();
            document.write(html);
            document.close();
        })
        .catch(function (err) {
            console.error("Failed:", err);
        });
})();
</script>
